<!DOCTYPE html>
<html>
<head>
    <title>Add Customer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .header {
            background: #1e3c72;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    Add Customer
</div>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card p-4 shadow">

                <form method="POST">

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" name="age" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Income</label>
                        <input type="number" name="income" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Credit Score</label>
                        <input type="number" name="credit" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Existing Loans</label>
                        <input type="number" name="existing_loans" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Customer
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="/customers" class="btn btn-dark">
                        Back
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
