<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .header {
            background: #1e3c72;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="header">
    Customers
</div>

<div class="container">

    <div class="text-end mb-3">
        <a href="/add_customer" class="btn btn-primary">
            Add Customer
        </a>
    </div>

    <table class="table table-striped shadow">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Income</th>
                <th>Credit</th>
                <th>Existing Loans</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for row in data %}
            <tr>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>₹ {{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>
                <td>
                    <a href="/new/{{ row[0] }}" class="btn btn-success btn-sm">
                        Apply Loan
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-dark">
            Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
