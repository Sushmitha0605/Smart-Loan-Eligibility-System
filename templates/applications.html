<!DOCTYPE html>
<html>
<head>
    <title>Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .header {
            background: #1e3c72;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .table-container {
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="header">
    All Loan Applications
</div>

<div class="container table-container">

    {% if data and data|length > 0 %}

    <table class="table table-striped shadow">
        <thead>
            <tr>
                <th>Name</th>
                <th>Decision</th>
                <th>Risk</th>
                <th>EMI</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for row in data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>
                    <span style="
                        {% if row[1] == 'Approved' %}color:green;
                        {% elif row[1] == 'Rejected' %}color:red;
                        {% else %}color:orange;
                        {% endif %}
                    ">
                        {{ row[1] }}
                    </span>
                </td>
                <td>{{ row[2] }}</td>
                <td>₹ {{ row[3] }}</td>
                <td>
                    <a href="/delete/{{ row[0] }}" class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    {% else %}

    <div class="text-center mt-5">
        <h5>No applications found</h5>
    </div>

    {% endif %}

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-dark">
            Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
