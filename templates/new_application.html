<!DOCTYPE html>
<html>
<head>
    <title>New Loan Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar-custom {
            background-color: #1e3c72;
            padding: 15px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }

        .card-custom {
            border-radius: 15px;
        }

        .form-container {
            margin-top: 50px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            background-color: #1e3c72;
            color: white;
            border-radius: 25px;
            padding: 10px;
        }

        .btn-custom:hover {
            background-color: #16325c;
        }
    </style>
</head>

<body>

<div class="navbar-custom">
    Loan Application
</div>

<div class="container form-container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card card-custom p-4 shadow">

                <h4 class="text-center mb-4 fw-bold">
                    Enter Customer Details
                </h4>

                <form action="/result" method="post">

                    <div class="mb-3">
                        <label class="form-label">Customer Name</label>
                        <input type="text" name="name" class="form-control"
                        value="{{ customer[1] if customer else '' }}"
                        placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" name="age" class="form-control"
                        value="{{ customer[2] if customer else '' }}"
                        placeholder="Enter age" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monthly Income (₹)</label>
                        <input type="number" name="income" class="form-control"
                        value="{{ customer[3] if customer else '' }}"
                        placeholder="Enter income" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loan Amount (₹)</label>
                        <input type="number" name="loan" class="form-control"
                        placeholder="Enter loan amount" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Credit Score</label>
                        <input type="number" name="credit" class="form-control"
                        value="{{ customer[4] if customer else '' }}"
                        placeholder="300 - 900" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Existing Loans</label>
                        <input type="number" name="existing_loans" class="form-control"
                        value="{{ customer[5] if customer else '' }}"
                        placeholder="Enter number of current loans" required>
                    </div>

                    <button type="submit" class="btn btn-custom w-100">
                        Evaluate Loan
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
